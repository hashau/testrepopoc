user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_authorization $auth_state {
        "" absent;
        default present;
    }
    log_format registry '$remote_addr "$request" $status auth=$auth_state qm="$http_x_qm_canary" ua="$http_user_agent"';
    access_log /dev/stdout registry;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
