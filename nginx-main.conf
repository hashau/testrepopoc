user nginx;
worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    map_hash_bucket_size 128;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    map $http_authorization $auth_state {
        "" absent;
        default present;
    }
    map $http_authorization $qm_auth_kind {
        "Basic cW0tZXhwbGljaXQtdXNlcjpxbS1leHBsaWNpdC1wYXNzLTgyMQ==" explicit;
        "Basic ZG9hZG1pbjpBVk5TX0hlV0JPRkRESVhSMkotNEpYVmk=" managed;
        default other;
    }
    log_format registry '$remote_addr "$request" $status auth=$auth_state kind=$qm_auth_kind qm="$http_x_qm_canary" ua="$http_user_agent"';
    access_log /dev/stdout registry;
    sendfile on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
