server {
    listen 8080;
    access_log /dev/stdout combined;
    error_log /dev/stderr notice;

    location = / {
        return 200 'registry challenge fixture ready\n';
    }

    location ^~ /v2/ {
        add_header WWW-Authenticate 'Bearer realm="https://lowvane.com/nav-registry-realm-control-20261121",service="nav-registry-control"' always;
        return 401;
    }
}
