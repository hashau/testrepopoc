server {
    listen 8080;
    error_log /dev/stderr notice;

    location = / {
        return 200 'registry challenge fixture ready\n';
    }

    location ^~ /v2/ {
        add_header WWW-Authenticate 'Bearer realm="https://qm-regtokerr.lowvane.com/token?researcher=hashau",service="qm-registry-token-error"' always;
        return 401;
    }
}
